tasks:
  - name: Pull Images
    init: ./services create
  - name: Start
    init: pip install python-dotenv invoke && apt install mosquitto-clients -y
    command: invoke -c services build step2-ld
  - name: Postman
    init: npm install -g newman
    command: newman run -e ./Dev.postman_environment.json --folder "Add Bridges to Orion" --folder "Add service to IOT Agent" --folder "Add devices to IOT Agent" 0_BData_project.postman_collection.json

ports:
  - name: Orion
    description: Context Broker
    port: 1026
    onOpen: notify
  - name: Keyrock
    description: Identity Manager
    port: 3005
    onOpen: open-preview
  - name: IoT Agent (North Port)
    description: NGSI data and device provisioning
    port: 4041
    onOpen: ignore
  - name: IoT Agent (South Port)
    description: Ultralight HTTP measures
    port: 7896
    onOpen: ignore
- name: Pep proxy
    description: Ultralight HTTP measures
    port: 7897
    onOpen: ignore
